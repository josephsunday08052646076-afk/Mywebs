<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportiva ⚽</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { 
      font-size: 38px; 
      margin-bottom: 12px; 
      font-weight: 800;
    }
    p { 
      font-size: 16px; 
      color: #d1d5db; 
      margin-bottom: 25px;
    }
    button {
      background: linear-gradient(90deg, #ff7e00, #ff3c00);
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sportiva ⚽</h1>
    <p>World Cup 2026 News & Football Updates</p>
    <button>Get Started</button>
  </div>
</body>
</html>
